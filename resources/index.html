<!doctype html>
<html>

<head>
  <title>{{ .title }}</title>
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet" href="./css/xterm.css" />
  <link rel="stylesheet" href="./css/xterm_customize.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <div id="terminal"></div>
  <script src="./auth_token.js"></script>
  <script src="./config.js"></script>
  <!-- Go WebAssembly support -->
  <script src="./js/wasm_exec.js"></script>
  <!-- Load WebAssembly module -->
  <script>
    // Global flag to track WebAssembly initialization
    window.mb64Initialized = false;

    // Load and instantiate the WebAssembly module
    async function loadWasm() {
      try {
        console.log('Loading mb64 WebAssembly module...');
        const response = await fetch('./js/mb64.wasm');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const bytes = await response.arrayBuffer();
        const go = new Go();
        const result = await WebAssembly.instantiate(bytes, go.importObject);
        go.run(result.instance);
        window.mb64Initialized = true;
        console.log('mb64 WebAssembly module loaded successfully');
      } catch (err) {
        console.error('Failed to load mb64 WebAssembly module:', err);
        // Show error in terminal
        const terminal = document.getElementById('terminal');
        if (terminal) {
          terminal.innerHTML = `<div style="color: red; padding: 20px;">
            Failed to load mb64 WebAssembly module: ${err.message}<br>
            Please check the browser console for more details.
          </div>`;
        }
      }
    }

    // Wait for both WebAssembly and config variables to be ready
    async function waitForConfig() {
      return new Promise((resolve) => {
        const checkConfig = () => {
          if (typeof gotty_auth_token !== 'undefined' && 
              typeof gotty_term !== 'undefined' && 
              typeof gotty_ws_query_args !== 'undefined') {
            resolve();
          } else {
            setTimeout(checkConfig, 10);
          }
        };
        checkConfig();
      });
    }

    Promise.all([loadWasm(), waitForConfig()]).then(() => {
      const script = document.createElement('script');
      script.src = './js/gotty.js';
      document.body.appendChild(script);
    });
  </script>
</body>

</html>
